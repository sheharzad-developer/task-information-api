AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  task-api bootstrap: ECR repository plus the IAM role GitHub Actions assumes
  through OIDC (no long-lived AWS keys stored in GitHub).

Parameters:
  AppName:
    Type: String
    Default: task-api
    AllowedPattern: "^[a-z][a-z0-9-]{1,30}$"
    Description: Base name for all resources. Must match AppName in 02-app.yml.
  GitHubOrg:
    Type: String
    Description: GitHub user or organisation that owns the repository (e.g. octocat).
  GitHubRepo:
    Type: String
    Description: Repository name only (e.g. task-api).
  GitHubEnvironment:
    Type: String
    Default: production
    Description: GitHub Actions environment the deploy job runs in. Only that environment can assume the role.
  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      An AWS account can hold only one GitHub OIDC provider. Set to false if
      token.actions.githubusercontent.com already exists under IAM > Identity providers.

Conditions:
  ShouldCreateOidcProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  EcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref AppName
      # Immutable tags: a commit SHA always points at exactly one image.
      ImageTagMutability: IMMUTABLE
      # Lets 'delete-stack' remove the repo even when it still holds images.
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep only the 15 most recent images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 15
                },
                "action": { "type": "expire" }
              }
            ]
          }

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AppName}-github-deploy
      Description: Assumed by GitHub Actions to push images to ECR and deploy to ECS.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - ShouldCreateOidcProvider
                - !Ref GitHubOidcProvider
                - !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # Only jobs in this repo's chosen environment, nothing else.
                # Second form: repos using GitHub's immutable subject claims
                # send "owner@<id>/repo@<id>" instead of "owner/repo".
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubOrg}/${GitHubRepo}:environment:${GitHubEnvironment}
                  - !Sub repo:${GitHubOrg}@*/${GitHubRepo}@*:environment:${GitHubEnvironment}
      Policies:
        - PolicyName: ecr-push
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EcrLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: EcrPushToThisRepoOnly
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt EcrRepository.Arn
        - PolicyName: ecs-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: TaskDefinitions
                Effect: Allow
                # These two actions do not support resource-level permissions.
                Action:
                  - ecs:DescribeTaskDefinition
                  - ecs:RegisterTaskDefinition
                Resource: "*"
              - Sid: UpdateThisServiceOnly
                Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - ecs:UpdateService
                Resource: !Sub arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:service/${AppName}-cluster/${AppName}-service
              - Sid: PassOnlyTheAppEcsRoles
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/${AppName}-ecs-*
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com

Outputs:
  EcrRepositoryUri:
    Description: Push images here.
    Value: !GetAtt EcrRepository.RepositoryUri
  DeployRoleArn:
    Description: Set as the AWS_DEPLOY_ROLE_ARN variable in GitHub.
    Value: !GetAtt GitHubDeployRole.Arn
