name: CI/CD

# Pull requests: lint + test + build + smoke-test the image (nothing is pushed).
# Pushes to main: all of the above, then push the SAME image to Amazon ECR and
# roll it out to ECS Fargate, then smoke-test the live URL.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  # Cancel superseded PR runs, but never cancel a deployment half-way.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  IMAGE_NAME: task-api
  # These default to the names the CloudFormation templates create.
  # Override any of them under Settings > Secrets and variables > Actions > Variables.
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'task-api' }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'task-api-cluster' }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE || 'task-api-service' }}
  ECS_TASK_FAMILY: ${{ vars.ECS_TASK_FAMILY || 'task-api' }}
  ECS_CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME || 'task-api' }}

jobs:
  # ---------------------------------------------------------------- 1. test
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check . --output-format=github
          ruff format --check .

      - name: Run tests with coverage
        run: pytest --cov --cov-report=term-missing --cov-report=xml --junitxml=junit.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            coverage.xml
            junit.xml
          retention-days: 14

  # ---------------------------------------------------------------- 2. build
  build:
    name: Build & smoke-test image
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Compute image tag (short commit SHA)
        id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          build-args: APP_VERSION=${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the container
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker run -d --name api -p 8000:8000 -e ENVIRONMENT=ci "$IMAGE"

          echo "Waiting for the API to come up..."
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/health > health.json 2>/dev/null && break
            sleep 1
          done
          cat health.json; echo

          # Health endpoint reports OK and the version baked in at build time
          grep -q '"status":"ok"' health.json
          grep -q "\"version\":\"$TAG\"" health.json

          # A real request round-trips through the app
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/api/v1/tasks \
                 -H 'Content-Type: application/json' -d '{"title":"smoke test"}')
          test "$code" = "201"

          # Invalid input is rejected
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/api/v1/tasks \
                 -H 'Content-Type: application/json' -d '{"title":""}')
          test "$code" = "422"

          # The container must not run as root
          user=$(docker inspect --format '{{.Config.User}}' "$IMAGE")
          echo "Container user: $user"
          test "$user" = "10001:10001"

      - name: Container logs (on failure)
        if: failure()
        run: docker logs api || true

      # Save the exact image that passed the smoke test so the deploy job
      # pushes it unchanged instead of rebuilding.
      - name: Save image for deploy job
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: docker save "${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}" | gzip > image.tar.gz

      - name: Upload image artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: docker-image
          path: image.tar.gz
          retention-days: 1

  # ---------------------------------------------------------------- 3. deploy
  deploy:
    name: Push to ECR & deploy to ECS
    needs: build
    # Only from main, and only once the AWS role has been configured, so the
    # pipeline stays green on a fresh fork before AWS is set up.
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    permissions:
      contents: read
      id-token: write # needed to request the OIDC token for AWS
    env:
      TAG: ${{ needs.build.outputs.image-tag }}
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v8
        with:
          name: docker-image

      - name: Load image
        run: gunzip -c image.tar.gz | docker load

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push image to ECR
        id: push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY:$TAG"
          # Tags are immutable in ECR. If this commit was already pushed
          # (e.g. a re-run), reuse that image instead of failing.
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
               --image-ids imageTag="$TAG" > /dev/null 2>&1; then
            echo "Image $IMAGE_URI already exists, skipping push."
          else
            docker tag "$IMAGE_NAME:$TAG" "$IMAGE_URI"
            docker push "$IMAGE_URI"
          fi
          echo "image-uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"
          echo "### Image: \`$IMAGE_URI\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition --task-definition "$ECS_TASK_FAMILY" \
            --query taskDefinition > task-definition.json

      - name: Put the new image into the task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ steps.push.outputs.image-uri }}
          environment-variables: |
            APP_VERSION=${{ env.TAG }}

      - name: Deploy to ECS (waits until the service is stable)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true

      - name: Smoke-test the live deployment
        if: vars.APP_URL != ''
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          for i in $(seq 1 24); do
            if curl -fsS "$APP_URL/health" | tee health.json | grep -q "\"version\":\"$TAG\""; then
              echo; echo "Live and serving version $TAG"
              echo "Deployed **$TAG** to $APP_URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Not serving $TAG yet (attempt $i), retrying in 5s..."
            sleep 5
          done
          echo "::error::$APP_URL/health never reported version $TAG"
          exit 1
